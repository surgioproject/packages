name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macOS-latest]
        node-version: [22, 26]

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, report coverage
        run: |
          pnpm build
          pnpm lint
          pnpm test
